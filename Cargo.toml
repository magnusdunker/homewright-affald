[package]
name = "homewright-affald"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "Tømmedage for affald fra de danske kommuner som ekstern integration til HomewrightHQ"
publish = false

[[bin]]
name = "affald"
path = "src/main.rs"

[dependencies]
homewright-plugin = { package = "thehome-plugin", git = "https://github.com/magnusdunker/homewrighthq-example-integration-rust", rev = "a8f05c1859f6689b2a31d2188593eb872408385e" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "native-tls-vendored", "cookies"] }
scraper = "0.20"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
